# PHP rules. Tests: php.php next to this file.
rules:
  - id: php-command-injection
    languages: [php]
    severity: ERROR
    message: >-
      Shell command built from dynamic input. Avoid the shell; if unavoidable, wrap each value
      with escapeshellarg().
    metadata: {category: security, severity: critical, cwe: "CWE-78"}
    patterns:
      - pattern-either:
          - pattern: system($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: shell_exec($CMD)
          - pattern: passthru($CMD, ...)
          - pattern: popen($CMD, ...)
          - pattern: proc_open($CMD, ...)
      - pattern-not: $F("...", ...)
      - pattern-not: $F(escapeshellarg(...), ...)

  - id: php-sql-injection
    languages: [php]
    severity: ERROR
    message: >-
      SQL built by concatenating or interpolating variables. Use prepared statements with bound
      parameters (PDO::prepare / mysqli::prepare).
    metadata: {category: security, severity: critical, cwe: "CWE-89"}
    patterns:
      - pattern-either:
          # <... ...> matches the concatenation anywhere inside the argument.
          - pattern: mysqli_query($C, <... "..." . $X ...>)
          - pattern: mysql_query(<... "..." . $X ...>)
          - pattern: $DB->query(<... "..." . $X ...>)
          - pattern: $DB->exec(<... "..." . $X ...>)
          - pattern: mysqli_query($C, "...$X...")
          - pattern: $DB->query("...$X...")

  - id: php-eval
    languages: [php]
    severity: ERROR
    message: >-
      eval/create_function/assert-with-string executes arbitrary PHP code.
    metadata: {category: security, severity: high, cwe: "CWE-95"}
    pattern-either:
      - pattern: eval(...)
      - pattern: create_function(...)
      - patterns:
          - pattern: assert($X)
          - pattern-not: assert(true)

  - id: php-unserialize
    languages: [php]
    severity: ERROR
    message: >-
      unserialize() on untrusted data can instantiate arbitrary objects (PHP object injection).
      Use json_decode, or pass ['allowed_classes' => false].
    metadata: {category: security, severity: high, cwe: "CWE-502"}
    patterns:
      - pattern: unserialize($X, ...)
      - pattern-not: unserialize($X, ['allowed_classes' => false])

  - id: php-extract-superglobal
    languages: [php]
    severity: ERROR
    message: >-
      extract() on request data lets the client overwrite any local variable (e.g. an isAdmin flag).
      Read the specific keys you need instead.
    metadata: {category: security, severity: high, cwe: "CWE-621"}
    pattern-either:
      - pattern: extract($_GET, ...)
      - pattern: extract($_POST, ...)
      - pattern: extract($_REQUEST, ...)
      - pattern: extract($_COOKIE, ...)

  - id: php-xss-echo
    languages: [php]
    severity: ERROR
    message: >-
      Request data echoed without escaping enables cross-site scripting. Wrap it in
      htmlspecialchars() with ENT_QUOTES and 'UTF-8'.
    metadata: {category: security, severity: high, cwe: "CWE-79"}
    pattern-either:
      - pattern: echo $_GET[...];
      - pattern: echo $_POST[...];
      - pattern: echo $_REQUEST[...];
      - pattern: print($_GET[...]);
      - pattern: print($_POST[...]);

  - id: php-hardcoded-secret
    languages: [php]
    severity: ERROR
    message: >-
      Hardcoded credential in source code. Load it from the environment (getenv) or a config
      file outside the web root.
    metadata: {category: security, severity: high, cwe: "CWE-798"}
    patterns:
      - pattern-either:
          - pattern: $K = "$V";
          - pattern: define("$K", "$V");
          - pattern: const $K = "$V";
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^\$?(password|passwd|pwd|secret|client_?secret|api_?key|access_?token|auth_?token|private_?key|db_?password|db_?pass)$
      - metavariable-regex: {metavariable: $V, regex: '.+'}

  - id: php-weak-hash
    languages: [php]
    severity: WARNING
    message: >-
      md5()/sha1() are broken for security use. Use password_hash() for passwords and
      hash('sha256', ...) elsewhere.
    metadata: {category: security, severity: medium, cwe: "CWE-328"}
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)
      - pattern: hash("md5", ...)
      - pattern: hash("sha1", ...)
